services:
  agent-orchestrator:
    build:
      context: .
      dockerfile: services/AgentOrchestratorService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5001:8080"

  conversation:
    build:
      context: .
      dockerfile: services/ConversationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5002:8080"

  identity:
    build:
      context: .
      dockerfile: services/IdentityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MongoDb__ConnectionString: mongodb://mongodb:27017
    ports:
      - "5003:8080"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    volumes:
      - mongodb-data:/data/db

  integration:
    build:
      context: .
      dockerfile: services/IntegrationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5004:8080"

  knowledge-base:
    build:
      context: .
      dockerfile: services/KnowledgeBaseService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5005:8080"

  notification:
    build:
      context: .
      dockerfile: services/NotificationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5006:8080"

volumes:
  mongodb-data:
